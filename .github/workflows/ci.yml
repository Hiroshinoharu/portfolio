# GitHub runs these checks on pushes and pull requests.
name: CI

on: [push, pull_request]

# The workflow only needs permission to read the repository.
permissions:
  contents: read

jobs:
  build-and-lint:
    # Use a fresh hosted Linux runner for each job.
    runs-on: ubuntu-latest
    steps:
      # Fetch the repository, then install Node and enable npm download caching.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # Install the exact versions recorded in package-lock.json.
      - run: npm ci
      # Type-check and bundle first, then check code quality with ESLint.
      - run: npm run build
      - run: npm run lint
